version: '3.8'

services:
  soldeer-db:
    image: postgres:15-alpine
    container_name: soldeer_postgres
    restart: always
    environment:
      POSTGRES_USER: soldeer_user
      POSTGRES_PASSWORD: soldeer_password123
      POSTGRES_DB: soldeer_db
    ports:
      - "8090:5432" 
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: